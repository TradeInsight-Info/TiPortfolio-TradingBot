<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Emerald-8 rounded-square background -->
  <rect x="0" y="0" width="256" height="256" rx="40" ry="40" fill="#065f46"/>

  <!-- Faint rising diagonal — chart-line motif -->
  <line x1="32" y1="198" x2="218" y2="70"
        stroke="#6ee7b7" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

  <!-- T — cross bar -->
  <rect x="50" y="72" width="96" height="22" rx="3" fill="#ffffff"/>
  <!-- T — vertical stem -->
  <rect x="82" y="72" width="30" height="120" rx="3" fill="#ffffff"/>

  <!-- i — vertical body -->
  <rect x="158" y="100" width="22" height="92" rx="3" fill="#ffffff"/>
  <!-- i — dot replaced by emerald-300 accent bar -->
  <rect x="154" y="58" width="28" height="28" rx="6" fill="#6ee7b7"/>
</svg>
