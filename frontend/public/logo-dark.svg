<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Light background for use on dark surfaces -->
  <rect x="0" y="0" width="256" height="256" rx="40" ry="40" fill="#f8fafc"/>

  <!-- Faint rising diagonal -->
  <line x1="32" y1="198" x2="218" y2="70"
        stroke="#065f46" stroke-width="10" stroke-linecap="round" opacity="0.2"/>

  <!-- T — cross bar -->
  <rect x="50" y="72" width="96" height="22" rx="3" fill="#065f46"/>
  <!-- T — vertical stem -->
  <rect x="82" y="72" width="30" height="120" rx="3" fill="#065f46"/>

  <!-- i — vertical body -->
  <rect x="158" y="100" width="22" height="92" rx="3" fill="#065f46"/>
  <!-- i — dot accent bar (matches primary colour) -->
  <rect x="154" y="58" width="28" height="28" rx="6" fill="#065f46"/>
</svg>
