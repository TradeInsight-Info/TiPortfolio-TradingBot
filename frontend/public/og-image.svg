<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="630" fill="#065f46"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-width="1" opacity="0.05"/>

  <!-- Decorative rising line (chart motif, large) -->
  <line x1="60" y1="560" x2="1140" y2="120"
        stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- Logo mark (160×160) positioned left-centre -->
  <rect x="80" y="235" width="160" height="160" rx="24" fill="#ffffff" fill-opacity="0.15"/>
  <!-- T cross bar -->
  <rect x="111" y="278" width="60" height="14" rx="2" fill="#ffffff"/>
  <!-- T stem -->
  <rect x="132" y="278" width="18" height="75" rx="2" fill="#ffffff"/>
  <!-- i body -->
  <rect x="182" y="300" width="14" height="53" rx="2" fill="#ffffff"/>
  <!-- i dot accent -->
  <rect x="178" y="265" width="18" height="18" rx="4" fill="#6ee7b7"/>

  <!-- "TiPortfolio" wordmark -->
  <text
    x="276"
    y="305"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-2"
  >TiPortfolio</text>

  <!-- Tagline -->
  <text
    x="276"
    y="368"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#6ee7b7"
    letter-spacing="0"
  >ETF portfolio optimisation, paper-traded live</text>

  <!-- Domain badge bottom right -->
  <text
    x="1120"
    y="600"
    font-family="Inter, system-ui, sans-serif"
    font-size="22"
    font-weight="500"
    fill="#ffffff"
    fill-opacity="0.5"
    text-anchor="end"
  >tradeinsight.info</text>
</svg>
