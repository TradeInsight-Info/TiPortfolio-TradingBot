# Daily PostgreSQL backup → Oracle OCI Object Storage + Cloudflare R2
# Schedule: 02:00 America/New_York
# Retention: keeps newest 30 dumps per destination; older ones deleted.
#
# Secrets required in default-secrets:
#   backup-oci-access-key   (OCI Customer Secret Key — Access Key ID)
#   backup-oci-secret-key   (OCI Customer Secret Key — Secret)
#   backup-oci-endpoint     (e.g. https://<namespace>.compat.objectstorage.us-ashburn-1.oraclecloud.com)
#   backup-oci-region       (e.g. us-ashburn-1)
#   backup-oci-bucket       (e.g. tiportfolio-backups)
#   backup-r2-access-key    (R2 Access Key ID)
#   backup-r2-secret-key    (R2 Secret Access Key)
#   backup-r2-endpoint      (https://<accountid>.r2.cloudflarestorage.com)
#   backup-r2-bucket        (e.g. tiportfolio-backups)
# DB password sourced from postgres-secret (db-pass).

apiVersion: batch/v1
kind: CronJob
metadata:
  name: tiportfolio-pg-backup
  labels:
    app: tiportfolio-pg-backup
    tier: backend
spec:
  schedule: "0 2 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:17-alpine
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "1000m"
              env:
                - name: PGHOST
                  value: "postgres18-service"
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: "tiportfolio-demo"
                - name: PGUSER
                  value: "postgres"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: db-pass
                - name: OCI_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-oci-access-key
                - name: OCI_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-oci-secret-key
                - name: OCI_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-oci-endpoint
                - name: OCI_REGION
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-oci-region
                - name: OCI_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-oci-bucket
                - name: R2_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-r2-access-key
                - name: R2_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-r2-secret-key
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-r2-endpoint
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: default-secrets
                      key: backup-r2-bucket
                - name: RETENTION
                  value: "30"
              volumeMounts:
                - name: work
                  mountPath: /work
              command:
                - /bin/sh
                - -ec
                - |
                  set -euo pipefail
                  log() { echo "[backup $(date -u +%FT%TZ)] $*" >&2; }
                  fail() { log "FAILED: $*"; exit 1; }

                  log "installing rclone"
                  apk add --no-cache rclone >/dev/null || fail "apk add rclone"

                  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  DUMP="/work/${PGDATABASE}-${STAMP}.sql.gz"

                  log "dumping ${PGDATABASE} from ${PGHOST}"
                  pg_dump --format=plain --no-owner --no-privileges \
                    | gzip -9 > "${DUMP}" || fail "pg_dump"
                  SIZE=$(stat -c %s "${DUMP}")
                  log "dump size=${SIZE} bytes -> ${DUMP##*/}"
                  [ "${SIZE}" -gt 1024 ] || fail "dump suspiciously small (${SIZE}B)"

                  export RCLONE_CONFIG=/work/rclone.conf
                  cat >"${RCLONE_CONFIG}" <<EOF
                  [oci]
                  type = s3
                  provider = Other
                  access_key_id = ${OCI_ACCESS_KEY}
                  secret_access_key = ${OCI_SECRET_KEY}
                  endpoint = ${OCI_ENDPOINT}
                  region = ${OCI_REGION}
                  acl = private

                  [r2]
                  type = s3
                  provider = Cloudflare
                  access_key_id = ${R2_ACCESS_KEY}
                  secret_access_key = ${R2_SECRET_KEY}
                  endpoint = ${R2_ENDPOINT}
                  region = auto
                  acl = private
                  EOF

                  upload_and_prune() {
                    REMOTE="$1"; BUCKET="$2"
                    log "uploading to ${REMOTE}:${BUCKET}"
                    rclone copyto "${DUMP}" "${REMOTE}:${BUCKET}/${DUMP##*/}" \
                      --s3-no-check-bucket --retries 3 --low-level-retries 5 \
                      || fail "upload ${REMOTE}"
                    log "pruning ${REMOTE} keep=${RETENTION}"
                    rclone lsf "${REMOTE}:${BUCKET}/" --include "${PGDATABASE}-*.sql.gz" \
                      | sort -r \
                      | tail -n +"$((RETENTION + 1))" \
                      | while IFS= read -r old; do
                          [ -n "${old}" ] || continue
                          log "delete ${REMOTE}:${BUCKET}/${old}"
                          rclone deletefile "${REMOTE}:${BUCKET}/${old}" \
                            || log "WARN: failed to delete ${old}"
                        done
                  }

                  upload_and_prune oci "${OCI_BUCKET}"
                  upload_and_prune r2  "${R2_BUCKET}"

                  log "OK ${DUMP##*/}"
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 5Gi
