# TiPortfolio Trading Bot — Flask API + daily scheduler CronJob
# Secrets required in default-secrets:
#   tiportfolio-alpaca-api-key
#   tiportfolio-alpaca-api-secret
#   tiportfolio-webhook-secret
#   tiportfolio-sentry-dsn  (optional)
# DB password sourced from postgres-secret (db-pass) — shared with cluster PG18.

kind: Deployment
apiVersion: apps/v1
metadata:
  name: tiportfolio-tradingbot
  labels:
    app: tiportfolio-tradingbot
    tier: backend
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tiportfolio-tradingbot
      tier: backend
  template:
    metadata:
      labels:
        app: tiportfolio-tradingbot
        tier: backend
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: registry-github
      containers:
        - name: tradingbot
          image: ghcr.io/tradeinsight-info/tiportfolio-tradingbot:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DB_HOST
              value: "postgres18-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "tiportfolio-demo"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db-pass
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: default-secrets
                  key: tiportfolio-alpaca-api-key
            - name: ALPACA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: default-secrets
                  key: tiportfolio-alpaca-api-secret
            - name: ALPACA_MODE
              value: "paper"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: default-secrets
                  key: tiportfolio-webhook-secret
            - name: ALLOWED_ORIGINS
              value: "https://tiportfolio-demo.tradeinsight.info"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: default-secrets
                  key: tiportfolio-sentry-dsn
                  optional: true
            # Phase 1: vix reuses the EXISTING Alpaca account (same key as the
            # legacy single-account bot) so it deploys with no new secret.
            - name: ALPACA_KEY_VIX
              valueFrom: { secretKeyRef: { name: default-secrets, key: tiportfolio-alpaca-api-key } }
            - name: ALPACA_SECRET_VIX
              valueFrom: { secretKeyRef: { name: default-secrets, key: tiportfolio-alpaca-api-secret } }
            # Phase 2: trend_broad + pit_top5 use their own new paper accounts.
            # Marked optional so the pod starts BEFORE these secret keys exist;
            # until populated, those strategies' webhooks fail visibly (empty creds),
            # and their scheduler CronJobs are not applied (see k8s/schedulers-*.yaml).
            - name: ALPACA_KEY_TREND
              valueFrom: { secretKeyRef: { name: default-secrets, key: tiportfolio-alpaca-key-trend, optional: true } }
            - name: ALPACA_SECRET_TREND
              valueFrom: { secretKeyRef: { name: default-secrets, key: tiportfolio-alpaca-secret-trend, optional: true } }
            - name: ALPACA_KEY_PIT
              valueFrom: { secretKeyRef: { name: default-secrets, key: tiportfolio-alpaca-key-pit, optional: true } }
            - name: ALPACA_SECRET_PIT
              valueFrom: { secretKeyRef: { name: default-secrets, key: tiportfolio-alpaca-secret-pit, optional: true } }

---
apiVersion: v1
kind: Service
metadata:
  name: tiportfolio-tradingbot
  labels:
    app: tiportfolio-tradingbot
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
  selector:
    app: tiportfolio-tradingbot
    tier: backend

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: webhook-deny
spec:
  # Traefik v2 field name (ipAllowList is v3). Loopback-only => deny all external.
  # Schedulers bypass Traefik (internal Service DNS), so they are unaffected.
  ipWhiteList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tiportfolio-tradingbot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`ti-bot-api.tradeinsight.info`) && PathPrefix(`/webhook`)
      kind: Rule
      priority: 100
      middlewares:
        - name: webhook-deny
        - name: redirect
      services:
        - name: tiportfolio-tradingbot
          port: 5000
    - match: Host(`ti-bot-api.tradeinsight.info`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect
      services:
        - name: tiportfolio-tradingbot
          port: 5000
  tls:
    secretName: tradeinsight-wildcard-tls

---
# Ensures at least one tradingbot pod stays available during voluntary disruptions
# (node drains, rolling updates). With a single replica this only guards voluntary
# disruptions — not crashes — but prevents accidental zero-replica windows.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tiportfolio-tradingbot-pdb
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: tiportfolio-tradingbot
      tier: backend
