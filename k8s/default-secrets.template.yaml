apiVersion: v1
kind: Secret
metadata:
  name: default-secrets
  namespace: default
type: Opaque
stringData:
  tiportfolio-alpaca-api-key: "<ALPACA_API_KEY>"
  tiportfolio-alpaca-api-secret: "<ALPACA_API_SECRET>"
  tiportfolio-webhook-secret: "<WEBHOOK_SECRET>"
  # optional — omit this line entirely if you don't have a Sentry project
  # tiportfolio-sentry-dsn: "<SENTRY_DSN>"
  # PostgreSQL backup — Oracle OCI Object Storage (S3-compatible)
  # Generate at: OCI Console → Identity → User → Customer Secret Keys
  backup-oci-access-key: "<OCI_S3_ACCESS_KEY>"
  backup-oci-secret-key: "<OCI_S3_SECRET_KEY>"
  backup-oci-endpoint: "https://<NAMESPACE>.compat.objectstorage.<REGION>.oraclecloud.com"
  backup-oci-region: "<OCI_REGION>"            # e.g. us-ashburn-1
  backup-oci-bucket: "<OCI_BUCKET_NAME>"
  # PostgreSQL backup — Cloudflare R2 (S3-compatible)
  # Generate at: R2 → Manage R2 API tokens
  backup-r2-access-key: "<R2_ACCESS_KEY_ID>"
  backup-r2-secret-key: "<R2_SECRET_ACCESS_KEY>"
  backup-r2-endpoint: "https://<CF_ACCOUNT_ID>.r2.cloudflarestorage.com"
  backup-r2-bucket: "<R2_BUCKET_NAME>"
