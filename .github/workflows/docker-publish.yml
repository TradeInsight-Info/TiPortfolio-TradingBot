name: Build and Push Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      py_changed: ${{ steps.diff.outputs.py_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "py_changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -q '\.py$'; then
            echo "py_changed=true" >> $GITHUB_OUTPUT
          else
            echo "py_changed=false" >> $GITHUB_OUTPUT
          fi

  approve:
    needs: check-changes
    if: needs.check-changes.outputs.py_changed == 'false'
    runs-on: ubuntu-latest
    environment: deploy-approval
    steps:
      - run: echo "Deployment approved for non-Python change"

  build-and-push:
    needs: [check-changes, approve]
    if: |
      always() &&
      needs.check-changes.result == 'success' &&
      (
        needs.check-changes.outputs.py_changed == 'true' ||
        needs.approve.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: tiportfolio-tradingbot
            context: .
            dockerfile: Dockerfile
          - image: tiportfolio-scheduler
            context: ./scheduler
            dockerfile: ./scheduler/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
